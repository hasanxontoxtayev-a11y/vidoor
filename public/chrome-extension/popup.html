<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Vidoor Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .logo span.vid { color: #38bdf8; }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .action-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .action-title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .search-box {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    input {
      flex: 1;
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    input:focus { outline: none; border-color: #10b981; }
    .btn-search {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="vidoor-emblem.jpg" style="width: 28px; height: 28px; border-radius: 6px; object-fit: cover;" alt="Vidoor" />
      <div class="logo"><span class="vid">vid</span>oor</div>
    </div>
    <div class="badge">100% BEPUL</div>
  </div>

  <div class="action-box">
    <div class="action-title" id="current-info">Hozirgi YouTube sahifasini tahlil qilish</div>
    <button class="btn-primary" id="btn-analyze-current">⚡ Shu kanalni Vidoorda ochish</button>
  </div>

  <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Boshqa kanalni qidirish:</div>
  <form id="search-form" class="search-box">
    <input type="text" id="input-query" placeholder="Kanal nomi yoki @handle..." />
    <button type="submit" class="btn-search">Ochish</button>
  </form>

  <div class="footer">
    Vidoor — YouTube Daromad va Analitika &bull; <a href="https://vidoor.vercel.app" target="_blank" style="color: #38bdf8; text-decoration: none;">vidoor.vercel.app</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
